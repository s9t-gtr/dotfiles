# break — brown #cc8c3c（休憩）。バー全体を茶味の暗トーンに（作業モードと明確に差別化）
set -g status-style "bg=#332a1c,fg=#e4e4ef"
set -g status-left-length 40
set -g status-left "#[bg=#cc8c3c,fg=#181818,bold] #S #[bg=#332a1c,fg=#cc8c3c,bold] ☕ BREAK #[bg=#332a1c] "
set -g window-status-format "#[fg=#95a99f] #I:#W "
set -g window-status-current-format "#[bg=#cc8c3c,fg=#181818,bold] #I:#W "
set -g pane-border-style "fg=#5a4a30"
set -g pane-active-border-style "fg=#cc8c3c"
set -g message-style "bg=#cc8c3c,fg=#181818"
set -g clock-mode-colour "#cc8c3c"
set -g status-right "#[fg=#cc8c3c,bold] BREAK #{?client_prefix,#[bg=#f43841]#[fg=#e4e4ef,bold] PREFIX ,#[bg=#cc8c3c]#[fg=#181818,bold] NORMAL }"
