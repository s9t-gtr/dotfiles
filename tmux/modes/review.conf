# review — yellow #ffdd33（注意・精査）。バー全体を黄味の暗トーンに
set -g status-style "bg=#33301c,fg=#e4e4ef"
set -g status-left-length 40
set -g status-left "#[bg=#ffdd33,fg=#181818,bold] #S #[bg=#33301c,fg=#ffdd33,bold] ● REVIEW #[bg=#33301c] "
set -g window-status-format "#[fg=#95a99f] #I:#W "
set -g window-status-current-format "#[bg=#ffdd33,fg=#181818,bold] #I:#W "
set -g pane-border-style "fg=#5a5020"
set -g pane-active-border-style "fg=#ffdd33"
set -g message-style "bg=#ffdd33,fg=#181818"
set -g clock-mode-colour "#ffdd33"
set -g status-right "#[fg=#ffdd33,bold] REVIEW #{?client_prefix,#[bg=#f43841]#[fg=#e4e4ef,bold] PREFIX ,#[bg=#ffdd33]#[fg=#181818,bold] NORMAL }"
