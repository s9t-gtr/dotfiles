# writing — wisteria #9e95c7（執筆）。バー全体を紫味の暗トーンに
set -g status-style "bg=#2b2733,fg=#e4e4ef"
set -g status-left-length 40
set -g status-left "#[bg=#9e95c7,fg=#181818,bold] #S #[bg=#2b2733,fg=#9e95c7,bold] ● WRITING #[bg=#2b2733] "
set -g window-status-format "#[fg=#95a99f] #I:#W "
set -g window-status-current-format "#[bg=#9e95c7,fg=#181818,bold] #I:#W "
set -g pane-border-style "fg=#4a4560"
set -g pane-active-border-style "fg=#9e95c7"
set -g message-style "bg=#9e95c7,fg=#181818"
set -g clock-mode-colour "#9e95c7"
set -g status-right "#[fg=#9e95c7,bold] WRITING #{?client_prefix,#[bg=#f43841]#[fg=#e4e4ef,bold] PREFIX ,#[bg=#9e95c7]#[fg=#181818,bold] NORMAL }"
