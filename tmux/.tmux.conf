# ========== Basic =============
# prefixにctrl+jを設定
 unbind C-b
 set -g prefix C-j
 bind -n C-j send-prefix
# defaultのterminalをzshに設定
set-option -g default-shell /bin/zsh

# run-shell / display-popup は最小 PATH で実行され /opt/homebrew/bin を含まない
# （Ghostty がログインシェルを介さず tmux を起動するため）。popup の nvim（prefix+m）や
# フックの tmux 等が見つからず即失敗するのを防ぐため、主要コマンドの PATH を補う。
# 新規ペインのシェルは .zshrc で PATH を再構築するので影響しない。
set-environment -g PATH "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"

# Prefix + k で画面と履歴を両方消去
bind K send-keys -R C-l \; clear-history

set-option -g default-terminal screen-256color-strike
set -g terminal-overrides 'xterm:colors=256'
set -s extended-keys on
set -as terminal-features ',*:extkeys'
# terminal-features はクライアント側の実端末名（TERM=xterm-ghostty）に対して
# 機能を宣言する必要がある。default-terminal（tmux内部向けのTERM名）に付けても
# 効かず、24bit色(truecolor)非対応とみなされて delta 等の \e[48;2;r;g;bm が
# 256色に丸められ、狙った色と違って見える
set -as terminal-features ',xterm-ghostty:RGB'

# アプリからのエスケープシーケンス（Kitty graphics protocol等）をGhosttyへ透過する (tmux 3.3+)
set -g allow-passthrough on

# prefix+r で設定のリロード
bind r source-file ~/.tmux.conf \; display ".tmux.conf Reloaded!"

# history-limitの上限緩和
set-option -g history-limit 5000

# ウィンドウを閉じた時に番号を振り直す
set -g renumber-windows on

# コピーモードでviキーバインドを使用
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# =========== Status Bar (Flexoki Light) =============
set -g status-position top
set -g status-right-length 100
set -g pane-border-status top # paneの番号と名前を表示

# Flexoki Light colors (紙: #fffcf0, インク: #100f0f)
# blue: #205ea6, green: #66800b, yellow: #ad8301
# red: #af3029, orange: #bc5215, purple: #5e409d
# gray(dim): #6f6e69, gray(light): #b7b5ac, gray(bg): #cecdc3

set -g status-style "bg=#cecdc3,fg=#100f0f"
set -g status-left "#[bg=#205ea6,fg=#fffcf0,bold] #S #[bg=#cecdc3] "
set -g status-left-length 30
set -g status-right "#{?client_prefix,#[bg=#af3029]#[fg=#fffcf0,bold] PREFIX ,#[bg=#66800b]#[fg=#fffcf0,bold] NORMAL }"

# window status
set -g window-status-format "#[fg=#6f6e69] #I:#W "
set -g window-status-current-format "#[bg=#cecdc3,fg=#ad8301,bold] #I:#W "
set -g window-status-separator ""

# pane border
set -g pane-border-style "fg=#b7b5ac"
set -g pane-active-border-style "fg=#205ea6"
set -g pane-border-format "#[fg=#205ea6] #{pane_index}: #{?pane_title,#{pane_title},#{pane_current_command}} "

# message & command line
set -g message-style "bg=#cecdc3,fg=#ad8301"
set -g message-command-style "bg=#cecdc3,fg=#100f0f"

# clock
set -g clock-mode-colour "#205ea6"

# =========== Keybindings =============
bind n next-window
# prefix+m でその日のメモをポップアップで開く
# display-popup は表示直後にキー入力転送が確立するまでラグがあり、開いてすぐ
# 打鍵すると先頭の入力が欠落する（日本語入力の途中バイトが消え文字化けする
# 不具合の原因だった）。転送確立を待つため起動前に少し待つ。
bind m display-popup -w 80% -h 60% -s "bg=#fffcf0,fg=#100f0f" -S "fg=#ad8301" -E "sleep 0.3; nvim ~/Obsidian/MEMO/$(date +%Y-%m-%d).md"

# prefix+s のセッションリストをセッション名のアルファベット順でソート
bind s choose-tree -Zs -O name

# =========== Window / Pane =============
# ウィンドウの作成（現在のactive paneのpwdを引き継ぐ）
bind c new-window -c "#{pane_current_path}"

# ペインの分割（現在のactive paneのpwdを引き継ぐ）
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vimのキーバインドでペインを移動する
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# ペイン切り替え時のフラッシュエフェクト
set-hook -g after-select-pane "run-shell '~/dotfiles/tmux/scripts/pane-flash.sh'"

# prefix + Shift + z で Zen Mode をトグル（中央寄せ）
bind Z run-shell "~/dotfiles/tmux/scripts/zen-mode.sh"

# =========== Focus Dimming =============
# ターミナルのフォーカスイベントを有効化
set -g focus-events on

# フォーカスが外れた時：画面を薄く霞ませる
set-hook -g client-focus-out \
  'set -g window-style "fg=#b7b5ac,bg=#cecdc3"; \
   set -g window-active-style "fg=#b7b5ac,bg=#cecdc3"'

# フォーカスが戻った時：元に戻す
set-hook -g client-focus-in \
  'set -g window-style "fg=default,bg=default"; \
   set -g window-active-style "fg=default,bg=default"'

# =========== Plugins =============
# tmux-plugins/tmux-resurrect: tmuxのセッションを保存・復元
set -g @tpm_plugins '              \
  tmux-plugins/tpm                 \
  tmux-plugins/tmux-resurrect      \
'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-processes 'nvim claude'
run-shell '~/.tmux/plugins/tpm/tpm'

