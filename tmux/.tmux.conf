# ========== Basic =============
# prefixにctrl+jを設定
 unbind C-b
 set -g prefix C-j
 bind -n C-j send-prefix
# defaultのterminalをzshに設定
set-option -g default-shell /bin/zsh

# run-shell / display-popup は最小 PATH で実行され /opt/homebrew/bin を含まない
# （Ghostty がログインシェルを介さず tmux を起動するため）。popup の nvim（prefix+m）や
# フックの tmux 等が見つからず即失敗するのを防ぐため、主要コマンドの PATH を補う。
# 新規ペインのシェルは .zshrc で PATH を再構築するので影響しない。
set-environment -g PATH "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"

# Prefix + k で画面と履歴を両方消去
bind K send-keys -R C-l \; clear-history

set-option -g default-terminal screen-256color-strike
set -g terminal-overrides 'xterm:colors=256'
set -s extended-keys on
set -as terminal-features ',*:extkeys'

# prefix+r で設定のリロード
bind r source-file ~/.tmux.conf \; display ".tmux.conf Reloaded!"

# history-limitの上限緩和
set-option -g history-limit 5000

# ウィンドウを閉じた時に番号を振り直す
set -g renumber-windows on

# コピーモードでviキーバインドを使用
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# =========== Status Bar (gruber-darker) =============
set -g status-position top
set -g status-right-length 100
set -g pane-border-status top # paneの番号と名前を表示

# gruber-darker colors
# bg: #181818, bg+1: #282828, fg: #e4e4ef
# niagara: #96a6c8, green: #73c936, red: #f43841
# yellow: #ffdd33, brown: #cc8c3c, wisteria: #9e95c7

set -g status-style "bg=#282828,fg=#e4e4ef"
set -g status-left "#[bg=#96a6c8,fg=#181818,bold] #S #[bg=#282828] "
set -g status-left-length 30
set -g status-right "#{?client_prefix,#[bg=#f43841]#[fg=#e4e4ef,bold] PREFIX ,#[bg=#73c936]#[fg=#181818,bold] NORMAL }"

# window status
set -g window-status-format "#[fg=#95a99f] #I:#W "
set -g window-status-current-format "#[bg=#181818,fg=#ffdd33,bold] #I:#W "
set -g window-status-separator ""

# pane border
set -g pane-border-style "fg=#484848"
set -g pane-active-border-style "fg=#96a6c8"
set -g pane-border-format "#[fg=#96a6c8] #{pane_index}: #{?pane_title,#{pane_title},#{pane_current_command}} "

# message & command line
set -g message-style "bg=#282828,fg=#ffdd33"
set -g message-command-style "bg=#282828,fg=#e4e4ef"

# clock
set -g clock-mode-colour "#96a6c8"

# =========== Keybindings =============
bind n next-window
# prefix+m でその日のメモをポップアップで開く
bind m display-popup -w 80% -h 60% -s "bg=#181818,fg=#e4e4ef" -S "fg=#ffdd33" -E "nvim ~/Obsidian/MEMO/$(date +%Y-%m-%d).md"

# prefix+s のセッションリストをセッション名のアルファベット順でソート
bind s choose-tree -Zs -O name

# =========== Window / Pane =============
# ウィンドウの作成（現在のactive paneのpwdを引き継ぐ）
bind c new-window -c "#{pane_current_path}"

# ペインの分割（現在のactive paneのpwdを引き継ぐ）
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vimのキーバインドでペインを移動する
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# ペイン切り替え時のフラッシュエフェクト
set-hook -g after-select-pane "run-shell '~/dotfiles/tmux/scripts/pane-flash.sh'"

# prefix + Shift + z で Zen Mode をトグル（中央寄せ）
bind Z run-shell "~/dotfiles/tmux/scripts/zen-mode.sh"

# =========== Focus Dimming =============
# ターミナルのフォーカスイベントを有効化
set -g focus-events on

# フォーカスが外れた時：画面を暗くする
set-hook -g client-focus-out \
  'set -g window-style "fg=colour244,bg=colour235"; \
   set -g window-active-style "fg=colour244,bg=colour235"'

# フォーカスが戻った時：元に戻す
set-hook -g client-focus-in \
  'set -g window-style "fg=default,bg=default"; \
   set -g window-active-style "fg=default,bg=default"'

# =========== Work Mode =============
# 作業モード別に tmux アクセント色と Ghostty 背景を切り替える（~/dotfiles/bin/workmode）。
# 狙いは色の心理効果ではなく、能動的な切替という儀式と、モード⇔見た目の反復条件付け。

# OSC 11（背景色の即時変更）を Ghostty まで通す
set -g allow-passthrough on

# prefix + W でモード選択メニュー。小文字=通常切替、大文字(Shift)=resume メモ付き切替
bind W display-menu -T "#[align=centre] Work Mode " -x C -y C \
  "Coding"   c "run-shell '~/dotfiles/bin/workmode coding'" \
  "Review"   r "run-shell '~/dotfiles/bin/workmode review'" \
  "Research" s "run-shell '~/dotfiles/bin/workmode research'" \
  "Writing"  w "run-shell '~/dotfiles/bin/workmode writing'" \
  "Break"    b "run-shell '~/dotfiles/bin/workmode break'" \
  "" \
  "-- with resume note (Shift) --" "" "" \
  "Coding  + note"   C "run-shell '~/dotfiles/bin/workmode coding -m'" \
  "Review  + note"   R "run-shell '~/dotfiles/bin/workmode review -m'" \
  "Research + note"  S "run-shell '~/dotfiles/bin/workmode research -m'" \
  "Writing + note"   W "run-shell '~/dotfiles/bin/workmode writing -m'" \
  "Break   + note"   B "run-shell '~/dotfiles/bin/workmode break -m'"

# tmux サーバ起動時に前回のモードを復元（冪等ガードにより二重適用は no-op）
run-shell '~/dotfiles/bin/workmode $(cat ~/.config/workmode 2>/dev/null || echo coding)'

# =========== Plugins =============
# tmux-plugins/tmux-resurrect: tmuxのセッションを保存・復元
set -g @tpm_plugins '              \
  tmux-plugins/tpm                 \
  tmux-plugins/tmux-resurrect      \
'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-processes 'nvim claude'
run-shell '~/.tmux/plugins/tpm/tpm'

